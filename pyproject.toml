[project]
name = "fitapply"
version = "0.2.0"
description = "FitApply: AI-powered job application agent for Iranian and global job boards"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright>=1.49.0",
    "pymupdf>=1.25.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "python-jobspy>=1.1.75",
    "litellm>=1.52.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
fitapply = "fitapply.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitapply"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
