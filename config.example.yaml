# ==========================================
# Job Apply Agent Configuration
# ==========================================

# Path to your master resume PDF (optional for sites like Jobinja/Jobvision with hosted resumes)
resume_path: "resume.pdf"

# Resume upload mode:
# - "auto": Use site-hosted profile for Iranian platforms (Jobinja, Jobvision, IranTalent), upload PDF for global boards
# - "site_profile": Never upload PDF, rely on pre-configured profile on the platform
# - "always_upload": Upload local PDF whenever a visible file input is present
resume_upload_mode: "auto"

# Candidate profile used for AI job-matching (especially when no PDF resume is provided)
candidate_profile:
  full_name: "Ali Moeini"
  headline: "Senior Backend Developer"
  years_of_experience: 6.0
  top_skills:
    - "Python"
    - "FastAPI"
    - "PostgreSQL"
    - "Docker"
    - "Playwright"
  secondary_skills:
    - "Redis"
    - "Kubernetes"
    - "CI/CD"
  summary: "Senior backend developer experienced in designing scalable microservices, async scraping, and workflow automation."
  location: "Tehran / Remote"
  languages:
    - "Persian (Native)"
    - "English (Professional)"

# LLM Provider settings
# Options for provider: "antigravity" (native Antigravity SDK) or "litellm"
llm:
  provider: "antigravity"  # or "litellm"
  # Model name if using litellm (e.g. gemini/gemini-2.5-flash, gpt-4o-mini, ollama/llama3.2)
  model: "gemini/gemini-2.5-flash"
  temperature: 0.2

# Search targets & criteria
search:
  keywords:
    - "Python Developer"
    - "Backend Engineer"
    - "Software Engineer"
  locations:
    - "Tehran"
    - "Remote"
  # Target platforms: jobinja, jobvision, irantalent, linkedin, indeed
  platforms:
    - "jobinja"
    - "jobvision"
    - "irantalent"

# Matching criteria
matching:
  min_fit_score: 75        # Only consider jobs with >= 75% compatibility
  max_applications_per_run: 10  # Daily rate-limiting guardrail

# Chrome CDP connection
chrome:
  cdp_url: "http://localhost:9222"
  timeout_seconds: 45

# Candidate supplementary details (used to answer screening questions)
candidate_answers:
  full_name: "Ali Moeini"
  email: "example@gmail.com"
  phone: "09123456789"
  city: "Tehran"
  military_service: "معافیت دائم / پایان خدمت"
  salary_expectation_irr_monthly: 60000000  # e.g. 60 Million Tomans / 600M Rials
  years_of_experience: 6
  degree: "کارشناسی"
  english_level: "حرفه‌ای / پیشرفته"
  github_url: "https://github.com/..."
  linkedin_url: "https://linkedin.com/in/..."
